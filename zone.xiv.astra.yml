app-id: zone.xiv.astra
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: astra
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
cleanup:
  # dev files
  - /share/cmake
  - /share/kdevappwizard
  - /include
  - /lib/cmake
  - /lib/x86_64-linux-gnu/cmake
  - /lib/x86_64-linux-gnu/pkgconfig
  - /mkspecs
finish-args:
  # Needed for X11, once we can remove that... remove this too
  - --share=ipc
  # We can switch to fallback-x11 once the Wine Wayland driver is on par with just running it through XWayland
  - --socket=x11
  - --socket=wayland
  - --share=network
  # Default directory for screenshots
  - --filesystem=xdg-pictures:rw
  # We need to install compatibility tools for Steam
  - --filesystem=~/.steam/steam/compatibilitytools.d/:rw
  - --filesystem=~/.var/app/com.valvesoftware.Steam/data/Steam/compatibilitytools.d/:rw
  - --socket=pulseaudio
  # Allow access to the GNOME secret service API and to talk to the GNOME keyring daemon
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.gnome.keyring
  # Allow to talk to the KDE kwallet daemon
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6
  - --device=all
  # Needed for Dalamud to run
  - --allow=devel
modules:
  - name: qtkeychain
    cleanup:
      - /bin
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_INSTALL_LIBDIR=/app/lib
      - -DLIB_INSTALL_DIR=/app/lib
      - -DBUILD_TRANSLATIONS=NO
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    sources:
      - type: archive
        url: https://github.com/frankosterfeld/qtkeychain/archive/refs/tags/0.17.0.tar.gz
        sha256: 3b85c3929034b0a99da777130c34d99f006fcd3a9d56564159399a33fee0e504
  - name: steam (x64)
    buildsystem: simple
    build-commands:
        - install -D steamwrap /app/libexec/steamwrap
        - install -D libsteam_api.so /app/libexec/libsteam_api.so
    only-arches:
      - x86_64
    sources:
      - type: file
        url: https://xiv.zone/distrib/steamwrap/1.0.0/x64/steamwrap
        sha256: 196a7d07fcfa65dbb13a6cb37490926cd6c219875f0184f4c5aa156e99d2c454
      - type: file
        url: https://xiv.zone/distrib/steamwrap/1.0.0/x64/libsteam_api.so
        sha256: 0f2c41c20644503c17e13498203986493332fc8296dbd78493bc1fed352ec0cc
  - name: steam (arm64)
    buildsystem: simple
    build-commands:
      - install -D steamwrap /app/libexec/steamwrap
      - install -D libsteam_api.so /app/libexec/libsteam_api.so
    only-arches:
      - aarch64
    sources:
      - type: file
        url: https://xiv.zone/distrib/steamwrap/1.0.0/arm64/steamwrap
        sha256: 455ce7ec5ab9c0c3c6a0e46f6f6df3839aac4ca17773b3018387c9c72bd73d56
      - type: file
        url: https://xiv.zone/distrib/steamwrap/1.0.0/arm64/libsteam_api.so
        sha256: 6010ff5049f0154a270092cb93729f1fc691d28e3b8a6f5fc6f8fcccfbd1e508
  - name: corrosion
    buildsystem: cmake-ninja
    config-opts:
      - -DCORROSION_BUILD_TESTS=OFF
    build-options:
      env:
        - CARGO_HOME: /run/build/corrosion/cargo
    cleanup:
      - /app
    sources:
      - type: archive
        url: https://github.com/corrosion-rs/corrosion/archive/refs/tags/v0.6.1.tar.gz
        sha256: e9e95b1ee2bad52681f347993fb1a5af5cce458c5ce8a2636c9e476e4babf8e3
  - name: wine
    buildsystem: simple
    build-commands:
      - mkdir /app/lib/wine
      - tar -xf wine-xiv-staging-fsync-git-ubuntu-10.8.r0.a2ca9e4.tar.xz --strip-components=1 --no-same-owner -C /app/lib/wine
      - rm -rf /app/lib/wine/include
    only-arches:
      - x86_64
    sources:
      - type: file
        url: https://github.com/goatcorp/wine-xiv-git/releases/download/10.8.r0.a2ca9e4/wine-xiv-staging-fsync-git-ubuntu-10.8.r0.a2ca9e4.tar.xz
        sha256: b9d74ea2f9db3f1eed1c9fdb7510996975a0deb20d268c117a69900709a3e815
  - name: dxvk
    buildsystem: simple
    build-commands:
      - mkdir /app/lib/dxvk
      - tar -xf dxvk-3.1.1.tar.gz --strip-components=1 --no-same-owner -C /app/lib/dxvk
      - rm -rf /app/lib/dxvk/x32
    sources:
      - type: file
        url: https://github.com/doitsujin/dxvk/releases/download/v3.1.1/dxvk-3.1.1.tar.gz
        sha256: 40565b4a724aadc4433fa4e010b4b23916d9b1f1baeee64e17186db94f54e608
  - name: fex-emu
    buildsystem: simple
    build-commands:
      - |
        bsdtar -Oxf fex-emu-wine_2610-1\~s_arm64.deb 'data.tar.zst' |
          bsdtar -xf -
      - install -D usr/lib/wine/aarch64-windows/libarm64ecfex.dll /app/libexec/libarm64ecfex.dll
    only-arches:
      - aarch64
    sources:
      - type: file
        url: https://launchpad.net/~fex-emu/+archive/ubuntu/fex/+files/fex-emu-wine_2610-1~s_arm64.deb
        sha256: dfca27ef4bba53f8f0c6d525a9dd522119e691e22e3e91fc4f82843f7be27ce6
  - name: astra
    buildsystem: cmake-ninja
    config-opts:
      - -DRust_COMPILER=/usr/lib/sdk/rust-stable/bin/rustc
      - -DCMAKE_INSTALL_LIBDIR=/app/lib
      - -DLIB_INSTALL_DIR=/app/lib
      - -DBUILD_TESTING=OFF
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    build-options:
      build-args:
        - --share=network # TODO: port to generated sources
    sources:
      - type: dir
        path: .
    cleanup:
      - /lib/debug/source/astra/launcher/.rcc # debug symbols for the auto-gen C++ source for QML is useless
